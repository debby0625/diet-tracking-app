<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diet Tracking App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #223; }
    form { display: grid; gap: .7rem; grid-template-columns: repeat(2, 1fr); }
    label { display: grid; gap: .25rem; }
    input, select, button { padding: .55rem; font: inherit; }
    form button { grid-column: 1 / -1; background: #2563eb; color: white; border: 0; border-radius: .35rem; }
    #meal-list { padding: 0; list-style: none; }
    #meal-list li { border-bottom: 1px solid #ddd; padding: .6rem 0; display: flex; justify-content: space-between; }
    .summary { margin: 1rem 0; padding: 1rem; background: #eef4ff; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>Diet Tracking App</h1>
  <p>Record meals and view a daily calorie total.</p>
  <form id="meal-form">
    <label>Food name <input id="food-name" required /></label>
    <label>Meal type <select id="meal-type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label>
    <label>Serving amount <input id="serving-amount" required /></label>
    <label>Calories <input id="calories" type="number" min="0" required /></label>
    <label>Date <input id="meal-date" type="date" required /></label>
    <button type="submit">Add meal record</button>
  </form>
  <section class="summary"><strong>Daily calorie total:</strong> <span id="daily-total">0</span> kcal</section>
  <h2>Meal history</h2>
  <ul id="meal-list"></ul>
  <script src="calorie-total.js"></script>
  <script src="app.js"></script>
</body>
</html>
